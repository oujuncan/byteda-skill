name: byteda
description: >-
  百搭 ByteDa AI 设计平台——一句话生成设计物料（海报、长图、社媒图文、科普图、PPT、条漫、H5 页面）
  以及单张图片、短视频、配音 / 音色克隆，经 ByteDa MCP 服务完成。

# 本技能自包含：通过 scripts/byteda.py 直接调用 ByteDa MCP（2026-07-28 无状态协议），宿主无需配置 MCP。

skill: ../SKILL.md

entrypoint:
  command: python3
  args:
    - scripts/byteda.py

env:
  # API Key：在 https://byteda.net/api-key 创建。也可以用 `byteda.py login` 存入 ~/.byteda/config.json。
  BYTEDA_TOKEN: ${BYTEDA_TOKEN}
  # 可选，默认 https://api.byteda.net/byte-da/mcp
  # BYTEDA_BASE_URL: https://api.byteda.net/byte-da/mcp

defaults:
  timeout: 1200
